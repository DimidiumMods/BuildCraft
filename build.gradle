plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base.archivesName = 'buildcraft'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ---------------------------------------------------------------------------
// Source layout during the port
//
//   src/api/java          ported BuildCraft API (was the BuildCraftAPI submodule)
//   src/main/java         ported mod code (files are `git mv`ed here from common/)
//   src/main/resources    ported assets/data (moved here from buildcraft_resources/)
//   sub_projects/expression  MC-independent expression library, compiled into main
//
// common/, BuildCraftAPI/, buildcraft_resources/ and src_old_license/ are the
// 1.12.2 / 1.7.10 reference trees. They are NOT compiled. See PORTING.md.
// ---------------------------------------------------------------------------
sourceSets {
    api {
        java.srcDir 'src/api/java'
    }
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'sub_projects/expression/src/main/java'
            srcDir 'sub_projects/expression/src/autogen/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'src/generated/resources'
            exclude '**/.cache'
        }
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    test {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo sourceSets.api

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            // one --mod per ported module
            ['buildcraftlib', 'buildcraftcore'].each { programArguments.addAll '--mod', it }
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'buildcraft.dev', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // All BuildCraft modules ship in one jar; each module is its own mod id
    // declared in neoforge.mods.toml, so this is a single "mod file" grouping.
    mods {
        buildcraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('compileJava') {
    dependsOn ':sub_projects:expression:generateSources'
}

// neoforge.mods.toml is templated from gradle.properties
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_license            : mod_license,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from sourceSets.api.output
    manifest.attributes([
        'Implementation-Title'  : 'BuildCraft',
        'Implementation-Version': mod_version,
    ])
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from sourceSets.api.output
    from sourceSets.api.allSource
}
assemble.dependsOn 'apiJar'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
