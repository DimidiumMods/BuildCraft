plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

repositories {
    mavenCentral()
}

group = "com.mod-buildcraft"
base.archivesName = "buildcraft-libexpression"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    // Standalone generator for the "autogen" node/function classes. It does
    // not depend on the main source set (main depends on its output).
    generator {
        java.srcDir "src/generator/java"
        resources.srcDir "src/generator/resources"
    }
    main {
        java {
            srcDir "src/main/java"
            srcDir "src/autogen/java"
        }
    }
}

dependencies {
    // Minecraft ships jsr305 at runtime, so consumers already have it.
    compileOnlyApi "com.google.code.findbugs:jsr305:3.0.2"
    testCompileOnly "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "junit:junit:4.13.2"
}

def autogenDir = layout.projectDirectory.dir("src/autogen/java")

tasks.register("removeOldAutoGen", Delete) {
    delete autogenDir.dir("buildcraft")
}

tasks.register("generateSources", JavaExec) {
    dependsOn "removeOldAutoGen"
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = "buildcraft.meta.generate.AutoGenerator"
    workingDir = projectDir
    args '-out', 'src/autogen/java', '-run', '-quiet'
    inputs.files(sourceSets.generator.allSource)
    outputs.dir(autogenDir)
}

tasks.named("compileJava") { dependsOn "generateSources" }
tasks.named("sourcesJar") { dependsOn "generateSources" }

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

publishing {
    repositories {
        maven {
            url = System.getenv("MAVEN_DIR") ?: layout.buildDirectory.dir("maven")
        }
    }
    publications {
        main(MavenPublication) {
            artifactId = "buildcraft-libexpression"
            from components.java
        }
    }
}
